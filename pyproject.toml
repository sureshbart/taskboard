[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sureshbart-taskboard"
version = "0.1.0"
description = "纯文本优先的任务看板，不联网也能用"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sureshbart" }]
keywords = ["task", "kanban", "plaintext", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sureshbart/taskboard"
Repository = "https://github.com/sureshbart/taskboard"
Issues = "https://github.com/sureshbart/taskboard/issues"

[project.scripts]
taskboard = "taskboard:main"

[tool.setuptools]
py-modules = ["taskboard"]
